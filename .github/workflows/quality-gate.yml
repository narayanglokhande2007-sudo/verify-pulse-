name: VerifyPulse Quality Gate



on:

  pull_request:
  
  push:
  
    branches: [main]
    


permissions:

  contents: read
  


concurrency:

  group: verifypulse-quality-${{ github.workflow }}-${{ github.ref }}
  
  cancel-in-progress: true
  


jobs:

  regression-and-integrity:
  
    name: Regression, reliability, and integrity
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 10
    


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: '20'
          
          check-latest: true
          


      - name: Install locked Node.js dependencies without lifecycle scripts
      
        run: npm ci --ignore-scripts
        


      - name: Reject high-severity production dependency vulnerabilities
      
        run: npm audit --omit=dev --audit-level=high
        


      - name: Run deterministic JavaScript quality suite
      
        run: npm test
        


      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.11'
          


      - name: Validate source-aware threat-intelligence fusion
      
        run: python pipeline/test_threat_intelligence.py
        


      - name: Validate threat-intelligence freshness gate
      
        run: python pipeline/test_threat_intelligence_freshness.py
        


      - name: Validate bounded feed collector safeguards
      
        run: python pipeline/test_bounded_feed_collector.py
        


      - name: Verify critical-file integrity baseline
      
        run: python pipeline/self_healing.py verify
        


  codeql:
  
    name: Static security analysis
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 12
    
    permissions:
    
      contents: read
      
      security-events: write
      


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        

      - name: Initialize CodeQL
      
        uses: github/codeql-action/init@v3
        
        with:
        
          languages: javascript-typescript, python
          


      - name: Analyze source code
      
        uses: github/codeql-action/analyze@v3
        




















































